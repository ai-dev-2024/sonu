[package]
name = "sonu-desktop"
version = "2.6.1"
description = "SONU - Offline Voice Typing"
authors = ["cjpais"]
edition = "2021"
license = "MIT"
default-run = "sonu-desktop"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sonu_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# [[bin]]
# name = "cli"
# path = "src/audio_toolkit/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[features]
# Engine selection for transcription (SONU). Each feature enables the matching
# transcribe-rs engine and the corresponding cfg-gated code paths in
# src/managers/transcription.rs. Note: `whisper` requires libclang at build
# time (whisper-rs/bindgen) — CI provides it. On dev machines without LLVM
# build with: --no-default-features --features parakeet,moonshine
default = ["parakeet", "whisper", "moonshine"]
parakeet = ["transcribe-rs/parakeet"]
whisper = ["transcribe-rs/whisper"]
moonshine = ["transcribe-rs/moonshine"]

[dependencies]
tauri = { version = "2.9.1", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
rusqlite_migration = "2.3"
tauri-plugin-fs = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16.0"
anyhow = "1.0.95"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.25"
env_filter = "0.1.0"
tokio = "1.43.0"
# Git dependencies are pinned to an exact commit. Without `rev`, Cargo resolves
# them to the repository's default-branch HEAD, so any `cargo update` (or a
# resolve that is not `--locked`) floats to whatever the fork currently points
# at — and a force-push silently changes what gets compiled.
vad-rs = { git = "https://github.com/cjpais/vad-rs", rev = "88b3a01f72f83a5d80d0e7ea9bacfc0d897fd03f", default-features = false }
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git", rev = "fed30292db417cb95305c118c0e1d804fb74cbff" }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
tar = "0.4.44"
flate2 = "1.0"
# Full engine set is enabled via the crate's `default` features above:
# Whisper (multilingual, GGML), Parakeet (fast ONNX), Moonshine (ultra-light ONNX).
transcribe-rs = { version = "0.2" }
ferrous-opencc = "0.2.3"
thiserror = "1.0"
keyring = { version = "3", features = ["linux-native", "windows-native", "apple-native"] }
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
regex = "1.10"
# Download integrity. `sha2` verifies artifacts whose host publishes a real
# content hash; `md5` reproduces the object-store ETag for hosts that only
# expose one (see `MULTIPART_PART_SIZE` in `managers/model.rs`).
sha2 = "0.10"
md5 = "0.7"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"
tauri-plugin-updater = "2.9.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Pinned to a commit: the previous `branch = "v2.1"` tracked a mutable ref.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "da9c9a8d4eb7f0524a2508988df1a7d9585b4904" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
