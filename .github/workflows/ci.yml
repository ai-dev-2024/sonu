name: "CI"

on:
  push:
    branches: [main]
    paths:
      - "apps/tauri-v2/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/tauri-v2/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/tauri-v2

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  # Fast, dependency-free check. Runs before the Rust build so a new panic site
  # fails in seconds rather than after a ten-minute toolchain setup.
  panic-ratchet:
    name: Panic Ratchet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tauri-v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Check for new unwrap()/expect() sites
        run: bash scripts/check-panic-ratchet.sh

  rust-check:
    name: Rust Check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/tauri-v2/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
        with:
          workspaces: "./apps/tauri-v2/src-tauri -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2

      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-noble.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-noble.list
          sudo apt update
          sudo apt install vulkan-sdk -y
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Rust format check
        run: cargo fmt -- --check

      - name: Clippy
        shell: bash
        run: |
          # `set -o pipefail` is required: without it the step's exit status is
          # `tee`'s (always 0) and clippy findings never failed the build, so CI
          # reported green while the lint gate was a no-op.
          #
          # `-D warnings` is deliberate: the tree is clean, so this is a real
          # gate. If a new lint fires, fix it or add a scoped `#[allow(...)]`
          # with a comment explaining why.
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy-output.txt
        # The build.yml reusable workflow handles the full multi-platform build.

      # The Clippy step tees its diagnostics to clippy-output.txt, but a runner is
      # ephemeral — without this the file dies with it and a clippy failure leaves
      # no retrievable evidence (which is exactly how the 2026-09-11 regression sat
      # undiagnosed). `if-no-files-found: ignore` keeps this from failing the job
      # when the failure came from an earlier step.
      - name: Upload clippy output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: clippy-output
          path: apps/tauri-v2/src-tauri/clippy-output.txt
          if-no-files-found: ignore

      # Downloading the job log requires admin rights on the repository, and the
      # artifact requires authentication, so a failure here was previously
      # undiagnosable from outside. A check annotation is readable through the
      # public API and shows up directly in the UI, so publish the error headlines
      # (error text plus file:line locations) as one. The surrounding code excerpts
      # are dropped — the headlines are what identify the problem, and annotations
      # are length-limited.
      - name: Surface clippy failure
        if: failure()
        shell: bash
        run: |
          # `shell: bash` implies `-eo pipefail`, and `grep | head` raises SIGPIPE
          # (141) as soon as head has its lines — which aborted this step before it
          # could report anything. Relax both, and never let this step itself fail.
          set +o pipefail
          set +e
          f=clippy-output.txt
          if [ -s "$f" ]; then
            # Cargo colourises its output, so an "error:" line carries a leading
            # escape sequence and never matches a `^error` anchor — strip ANSI
            # first. Report every error headline and its file:line, not just the
            # last one, so one run identifies all the sites at once.
            clean=$(sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$f" | tr -d '\r')
            body=$(printf '%s\n' "$clean" | grep -E '^error|^ *--> ' | head -n 24)
            if [ -z "$body" ]; then
              body=$(printf '%s\n' "$clean" | tail -n 15)
            fi
            tail_="[$(wc -l < "$f") lines / $(wc -c < "$f") bytes]"
          else
            body="clippy-output.txt was empty or missing"
            tail_="the failure was in an earlier step"
          fi
          # A workflow command must be a single line: escape % and join with %0A.
          msg=$(printf '%s\n%s\n' "$body" "$tail_" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          msg=$(printf '%s' "$msg" | cut -c1-1900)
          printf '::error title=Clippy failure::%s\n' "$msg"
          exit 0

  # Advisory: reports known vulnerabilities in the Rust dependency graph.
  # Non-blocking while the existing advisory backlog is triaged; make it a
  # required check once that is done.
  rust-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    # The workflow declares no permissions, so the token is read-only and
    # rustsec/audit-check cannot publish its results — it failed with "Resource
    # not accessible by integration". It needs to create a check run. The job
    # stays advisory (`continue-on-error`), so this cannot block a merge.
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: apps/tauri-v2/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Must be `working-directory` (kebab-case): that is the input the action
          # declares. As `workingDirectory` it was silently ignored, so the audit
          # ran at the repo root where there is no Cargo.toml and died with
          # "Unexpected end of JSON input". The job-level `defaults.run` above
          # does not apply here because this is a `uses:` step, not a `run:` step.
          working-directory: apps/tauri-v2/src-tauri
