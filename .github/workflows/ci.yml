name: "CI"

on:
  push:
    branches: [main]
    paths:
      - "apps/tauri-v2/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/tauri-v2/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/tauri-v2

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  # Fast, dependency-free check. Runs before the Rust build so a new panic site
  # fails in seconds rather than after a ten-minute toolchain setup.
  panic-ratchet:
    name: Panic Ratchet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tauri-v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Check for new unwrap()/expect() sites
        run: bash scripts/check-panic-ratchet.sh

  rust-check:
    name: Rust Check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/tauri-v2/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
        with:
          workspaces: "./apps/tauri-v2/src-tauri -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2

      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-noble.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-noble.list
          sudo apt update
          sudo apt install vulkan-sdk -y
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Rust format check
        run: cargo fmt -- --check

      - name: Clippy
        shell: bash
        run: |
          # `set -o pipefail` is required: without it the step's exit status is
          # `tee`'s (always 0) and clippy findings never failed the build, so CI
          # reported green while the lint gate was a no-op.
          #
          # `-D warnings` is deliberate: the tree is clean, so this is a real
          # gate. If a new lint fires, fix it or add a scoped `#[allow(...)]`
          # with a comment explaining why.
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy-output.txt
        # The build.yml reusable workflow handles the full multi-platform build.

      # Clippy compiles the test target but nothing ever *runs* it, so the Rust
      # suite (52 tests, including the regression tests for the deadlock, crash and
      # data-loss fixes) was unexercised in CI. The toolchain, Vulkan SDK and
      # libclang are already set up and the dependencies are already built by this
      # point, so this costs little. The keychain tests are fine here: `keyring` is
      # pulled with the `linux-native` feature (kernel keyutils), which needs no
      # Secret Service daemon.
      - name: Tests
        id: tests
        # Advisory, not blocking. The test binary links the prebuilt ONNX Runtime
        # (via `ort`) and whisper.cpp, and on some runner CPUs it aborts with
        # `SIGILL: illegal instruction` before a single test executes — the same
        # code passed on three earlier runs and failed on a fourth. It is an
        # environment capability difference, not a test failure, so a retry would
        # not help (same CPU). Until the offending instruction is identified,
        # report the result instead of blocking on it.
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --lib 2>&1 | tee test-output.txt
          # Guard against the suite silently running nothing: `cargo test` exits 0
          # when zero tests match a filter, which is the same "gate reports green
          # while doing nothing" failure mode that hid the clippy regression for
          # two days. The suite is 52 tests; 45 is the floor, so adding tests is
          # fine but quietly losing the suite is not.
          #
          # `grep -m1` rather than `grep | head`: head would raise SIGPIPE under the
          # `pipefail` set above.
          line=$(grep -m1 -oE 'test result: ok\. [0-9]+ passed' test-output.txt || true)
          ran=$(printf '%s' "$line" | tr -dc '0-9')
          if [ -z "$ran" ] || [ "$ran" -lt 45 ]; then
            printf '::error title=Rust test failure::expected at least 45 Rust tests to run, saw "%s"\n' "${ran:-none}"
            exit 1
          fi
          echo "Rust tests ran: $ran"

      # The Clippy and Tests steps tee their output to files, but a runner is
      # ephemeral — without this the files die with it and a failure leaves no
      # retrievable evidence (which is exactly how the 2026-09-11 regression sat
      # undiagnosed). `if-no-files-found: ignore` keeps this from failing the job
      # when the failure came from an earlier step.
      - name: Upload logs
        # `steps.tests.outcome` as well as `failure()`: the Tests step is
        # `continue-on-error`, so its failure does not fail the job.
        if: failure() || steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: rust-check-logs
          path: |
            apps/tauri-v2/src-tauri/clippy-output.txt
            apps/tauri-v2/src-tauri/test-output.txt
          if-no-files-found: ignore

      # Downloading the job log requires admin rights on the repository, and the
      # artifact requires authentication, so a failure here would otherwise be
      # undiagnosable from outside. A check annotation is readable through the
      # public API and shows up in the UI, so publish the error headlines as one.
      - name: Surface clippy failure
        if: failure()
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/apps/tauri-v2/scripts/ci-annotate-failure.sh" \
            clippy-output.txt "Clippy failure"

      - name: Surface test failure
        # `failure()` would not fire: the Tests step is `continue-on-error`, so it
        # does not put the job into a failed state. Key off the step's own outcome.
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/apps/tauri-v2/scripts/ci-annotate-failure.sh" \
            test-output.txt "Rust test failure"

  # Advisory: reports known vulnerabilities in the Rust dependency graph.
  # Non-blocking while the existing advisory backlog is triaged; make it a
  # required check once that is done.
  rust-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    # The workflow declares no permissions, so the token is read-only and
    # rustsec/audit-check cannot publish its results — it failed with "Resource
    # not accessible by integration". It needs to create a check run. The job
    # stays advisory (`continue-on-error`), so this cannot block a merge.
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: apps/tauri-v2/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Must be `working-directory` (kebab-case): that is the input the action
          # declares. As `workingDirectory` it was silently ignored, so the audit
          # ran at the repo root where there is no Cargo.toml and died with
          # "Unexpected end of JSON input". The job-level `defaults.run` above
          # does not apply here because this is a `uses:` step, not a `run:` step.
          working-directory: apps/tauri-v2/src-tauri

  # Nothing else in CI compiles the Rust code for Windows or macOS: the clippy and
  # test jobs are Linux-only, and build.yml only runs on a release. Every
  # platform-gated bug in this repo's history came from that blind spot — the
  # Unix-gated clippy lints, a macOS `E0384` in lib.rs, and a Windows
  # cmake/Visual-Studio-2026 failure that broke releases for a week.
  #
  # This is the cheap half of the guard: `--no-default-features --features
  # parakeet,moonshine` skips `whisper`, so neither libclang nor the Vulkan SDK is
  # needed and the job is a few minutes per leg. It would have caught the `E0384`
  # immediately. Failures in the whisper/CMake path itself still need the full
  # build, which build.yml covers on release.
  platform-check:
    name: Platform Check (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-15]
    defaults:
      run:
        working-directory: apps/tauri-v2/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
        with:
          workspaces: "./apps/tauri-v2/src-tauri -> target"

      # `--all-targets` so platform-gated *test* code is compiled too: the
      # whisper-gated `mod tests` that broke CI on 2026-09-11 was only ever
      # compiled by clippy's `--all-targets` on Linux.
      - name: cargo check
        run: cargo check --all-targets --no-default-features --features parakeet,moonshine
