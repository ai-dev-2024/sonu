name: "Release"

# Manual dispatch, or automatic when the app version changes on main
# (tauri.conf.json is the single source of truth for the release version).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/tauri-v2/src-tauri/tauri.conf.json"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  should-release:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Skip if this version is already released
        id: check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const conf = JSON.parse(
              fs.readFileSync('apps/tauri-v2/src-tauri/tauri.conf.json', 'utf8')
            );
            const tag = `v${conf.version}`;
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const exists = releases.some((r) => r.tag_name === tag);
            core.setOutput('skip', exists ? 'true' : 'false');
            console.log(`tag ${tag}: ${exists ? 'already released, skipping' : 'not released, continuing'}`);

  create-release:
    permissions:
      contents: write
    needs: should-release
    if: needs.should-release.outputs.skip == 'false'
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' apps/tauri-v2/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const tag_name = `v${{ steps.get-version.outputs.version }}`;
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name,
              name: `SONU v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            }
            try {
              const { data } = await github.rest.repos.createRelease(params)
              return data.id
            } catch (error) {
              // A previous run may have left a draft for this tag: reuse it so
              // re-runs never duplicate releases.
              if (error.status === 422) {
                const { data: releases } = await github.rest.repos.listReleases({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100,
                })
                const existing = releases.find((r) => r.tag_name === tag_name)
                if (existing) {
                  console.log(`Reusing existing ${existing.draft ? 'draft' : 'published'} release for ${tag_name}`)
                  return existing.id
                }
              }
              throw error
            }

  publish-tauri:
    permissions:
      contents: write
    needs: [should-release, create-release]
    if: needs.should-release.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-15"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-15"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          # ubuntu-22.04 runner images are deprecated (brownouts from Sep 2026);
          # the deb now builds on 24.04, so it targets Ubuntu 24.04+ (glibc 2.39).
          # Users on older distros should use the AppImage.
          - platform: "ubuntu-24.04"
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04"
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "sonu"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  # Publish the draft release after all platform builds complete.
  # Note: tauri-action already uploads latest.json with updater signatures.
  publish-release:
    permissions:
      contents: write
    needs: [should-release, create-release, publish-tauri]
    if: needs.should-release.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release-id }},
              draft: false
            })
            console.log('Release published successfully!')
