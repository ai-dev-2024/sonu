version: 2

updates:
  # Rust backend
  - package-ecosystem: cargo
    directory: /apps/tauri-v2/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Batch routine bumps so the PR queue stays manageable; security updates
      # are always raised separately by Dependabot.
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend (Bun)
  - package-ecosystem: bun
    directory: /apps/tauri-v2
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      bun-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions themselves. These are pinned to commit SHAs in the
  # workflows; Dependabot is what keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
